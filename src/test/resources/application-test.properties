spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically run schema.sql on the in-memory database
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# TMDB Dummy Properties for Testing
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=test-api-key
tmdb.api.token=test-api-token